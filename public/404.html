<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Enamul Islam — Software Engineer & AI Product Builder</title>
    <script>
      // GitHub Pages SPA fallback
      // Converts path-based routes to hash-based routes for client-side routing
      (function () {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        if (l.pathname !== '/' && l.pathname !== '/index.html') {
          var redirect =
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
            '/?/' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash;
          window.location.replace(redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore the original path from the query string and redirect to hash route
      (function () {
        var l = window.location;
        if (l.search.indexOf('?/') === 0) {
          var query = l.search.slice(2);
          var parts = query.split('&');
          var path = parts[0].replace(/~and~/g, '&');
          var hash = parts.slice(1).join('&').replace(/~and~/g, '&');
          window.history.replaceState(null, null, l.pathname + (path ? '#' + path : '') + (hash ? '?' + hash : ''));
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
